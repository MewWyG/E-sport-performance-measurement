<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillPulse | Human Performance Benchmarking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #6366f1;
            --brand-secondary: #06b6d4;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Kanit', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #22d3ee 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-pulse {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-pulse:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--brand-primary);
        }

        .page-transition {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-area {
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s ease;
        }

        .state-waiting { background-color: #ef4444; }
        .state-ready { background-color: #22c55e; }
        .state-idle { background-color: #334155; }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen flex flex-col">
        <!-- Navigation -->
        <nav class="sticky top-0 z-50 px-6 py-4 glass-card rounded-none border-t-0 border-x-0 mx-0">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('landing')">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <span class="text-2xl font-extrabold tracking-tight uppercase">SkillPulse</span>
                </div>
                
                <div class="flex items-center gap-4 md:gap-8 font-semibold">
                    <div class="hidden md:flex items-center gap-8 text-slate-400">
                        <button onclick="router.navigate('library')" class="hover:text-white transition-colors" data-i18n="nav_library">คลังเกม</button>
                        <button onclick="router.navigate('history')" class="hover:text-white transition-colors" data-i18n="nav_history">ประวัติการเล่น</button>
                    </div>
                    
                    <!-- Language Switcher -->
                    <div class="flex bg-slate-800 rounded-full p-1 border border-slate-700">
                        <button id="lang-th" onclick="i18n.setLang('th')" class="px-3 py-1 rounded-full text-xs transition-all">TH</button>
                        <button id="lang-en" onclick="i18n.setLang('en')" class="px-3 py-1 rounded-full text-xs transition-all">EN</button>
                    </div>

                    <button class="px-5 py-2.5 bg-indigo-600 text-white rounded-full btn-pulse text-sm" data-i18n="btn_signin">เข้าสู่ระบบ</button>
                </div>
            </div>
        </nav>

        <!-- Main View Container -->
        <main id="view-container" class="flex-grow p-6 md:p-12 max-w-7xl mx-auto w-full">
            <!-- Dynamic content -->
        </main>

        <footer class="p-12 border-t border-slate-800 text-center text-slate-500">
            <p>&copy; 2024 SkillPulse Lab. <span data-i18n="footer_tag">วัดประสิทธิภาพศักยภาพมนุษย์</span></p>
        </footer>
    </div>

    <script type="text/template" id="tpl-library">

            <div class="mb-12">
                <h2 class="text-4xl font-black mb-2 font-kanit" data-i18n="nav_library">คลังเกม</h2>

        </div>

    <script type="text/template" id="tpl-detail">
        <div class="page-transition max-w-4xl mx-auto">
            <button onclick="router.navigate('library')" class="mb-8 flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
                <svg class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span data-i18n="btn_back_library">กลับไปยังคลังเกม</span>

            <div class="glass-card p-8 md:p-12">

                </div>

                    <ul class="space-y-4 text-slate-400" id="instructions-list"></ul>

    <script type="text/template" id="tpl-gameplay">

    </script>

    <script type="text/template" id="tpl-result">

                </div>
                <h1 class="text-4xl font-black mb-2 font-kanit" data-i18n="result_done">ทดสอบเสร็จสมบูรณ์!</h1>
                <p class="text-slate-400" data-i18n="result_desc">นี่คือผลการทดสอบของคุณ</p>
            </div>
            <div class="glass-card p-12 mb-12">
                <span id="result-label" class="text-slate-400 uppercase tracking-widest font-bold text-sm"></span>

                <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden mt-8 mb-4">
                    <div id="result-bar" class="h-full bg-gradient-to-r from-indigo-500 to-cyan-400" style="width: 70%"></div>
                </div>
                <p class="text-slate-400"><span data-i18n="result_pct_prefix">คุณเร็วกว่า</span> <span id="result-percentile" class="text-white font-bold"></span> <span data-i18n="result_pct_suffix">ของผู้ทดสอบทั้งหมด</span></p>
            </div>
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <button id="retry-btn" class="px-8 py-4 bg-indigo-600 text-white font-bold rounded-xl btn-pulse" data-i18n="btn_retry">ลองใหม่อีกครั้ง</button>

            </div>
        </div>
    </script>

    <script type="text/template" id="tpl-history">
        <div class="page-transition">
            <div class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">

                    <h2 class="text-4xl font-black mb-2 font-kanit" data-i18n="nav_history">ประวัติการเล่น</h2>

                </div>
                <button id="clear-history" class="px-4 py-2 border border-rose-500/30 text-rose-400 rounded-lg hover:bg-rose-500/10 transition-colors" data-i18n="btn_clear_history">ล้างประวัติทั้งหมด</button>
            </div>
            <div class="glass-card overflow-hidden border-slate-800">
                <div class="max-h-[600px] overflow-y-auto history-list">
                    <table class="w-full text-left">
                        <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs tracking-wider">
                            <tr>

                                <th class="px-8 py-4" data-i18n="th_score">คะแนน</th>

                                <th class="px-8 py-4" data-i18n="th_status">สถานะ</th>
                            </tr>
                        </thead>
                        <tbody id="history-rows" class="divide-y divide-slate-800"></tbody>
                    </table>
                    <div id="history-empty" class="p-20 text-center text-slate-500 hidden">
                        <p class="text-xl" data-i18n="history_empty">ยังไม่มีประวัติการเล่น เริ่มเล่นเกมเพื่อดูสถิติของคุณ!</p>
                    </div>
                </div>
            </div>
        </div>
    </script>

                btn_retry: 'Try Again',
                btn_other_games: 'Pick Another Game',
                history_desc: 'Your performance journey across all benchmarks.',
                btn_clear_history: 'Clear History',
                th_benchmark: 'Benchmark',
                th_score: 'Score',
                th_date: 'Date',
                th_status: 'Status',
                history_empty: 'No history found. Start playing to see your stats!',
                status_success: 'Success',
                game_ready: 'Ready?',
                game_ready_sub: 'Click anywhere to start the timer.',
                game_wait: 'Wait for green...',
                game_click: 'CLICK!',
                game_too_soon: 'Too Soon!',
                game_too_soon_sub: 'Click to try again',
                instruction_1: 'Wait for the screen to turn green.',
                instruction_2: 'Click or tap as fast as you can.',
                instruction_3: 'Check your results and try again for a better record!'
            }
        };

        const i18n = {
            lang: localStorage.getItem('skillpulse_lang') || 'th',
            setLang(l) {
                this.lang = l;
                localStorage.setItem('skillpulse_lang', l);
                this.updateUI();
                router.render();
            },
            t(key) {
                return translations[this.lang][key] || key;
            },
            updateUI() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.innerText = this.t(key);
                });
                document.getElementById('lang-th').className = `px-3 py-1 rounded-full text-xs transition-all ${this.lang === 'th' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`;
                document.getElementById('lang-en').className = `px-3 py-1 rounded-full text-xs transition-all ${this.lang === 'en' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`;
            }
        };

        const games = [
            { id: 'reaction', title: { th: 'ความเร็วการตอบสนอง', en: 'Reaction Time' }, desc: { th: 'ทดสอบการตอบสนองทางการมองเห็นของคุณ', en: 'Test your visual reflexes.' }, icon: '⚡', color: 'bg-amber-500/20 text-amber-400', unit: 'ms' },
            { id: 'sequence', title: { th: 'ความจำลำดับ', en: 'Sequence Memory' }, desc: { th: 'จดจำลำดับของช่องสี่เหลี่ยมที่เพิ่มขึ้นเรื่อยๆ', en: 'Remember an ever-growing sequence of squares.' }, icon: '🔢', color: 'bg-blue-500/20 text-blue-400', unit: 'pts' },
            { id: 'aim', title: { th: 'ฝึกการยิง', en: 'Aim Trainer' }, desc: { th: 'ยิงเป้าหมาย 30 จุดได้เร็วแค่ไหน?', en: 'How fast can you hit 30 targets?' }, icon: '🎯', color: 'bg-rose-500/20 text-rose-400', unit: 'ms' },
            { id: 'verbal', title: { th: 'ความจำคำศัพท์', en: 'Verbal Memory' }, desc: { th: 'รักษาคำศัพท์ไว้ในความจำระยะสั้นให้ได้มากที่สุด', en: 'Keep words in your short-term memory.' }, icon: '📖', color: 'bg-emerald-500/20 text-emerald-400', unit: 'pts' },
            { id: 'chimp', title: { th: 'แบบทดสอบชิมแปนซี', en: 'Chimp Test' }, desc: { th: 'คุณฉลาดกว่าลิงชิมแปนซีหรือไม่?', en: 'Are you smarter than a chimpanzee?' }, icon: '🐵', color: 'bg-purple-500/20 text-purple-400', unit: 'pts' },
            { id: 'typing', title: { th: 'ความเร็วการพิมพ์', en: 'Typing Speed' }, desc: { th: 'วัดความเร็วในการพิมพ์คำต่อนาทีของคุณ', en: 'Measure your words per minute.' }, icon: '⌨️', color: 'bg-cyan-500/20 text-cyan-400', unit: 'wpm' }
        ];

        let playHistory = JSON.parse(localStorage.getItem('skillpulse_history') || '[]');

        const router = {
            currentView: 'landing',
            params: {},
            navigate(view, params = {}) {
                this.currentView = view;
                this.params = params;
                this.render();
                window.scrollTo(0, 0);
            },
            render() {
                const container = document.getElementById('view-container');
                const template = document.getElementById(`tpl-${this.currentView}`);
                if (template) {
                    container.innerHTML = template.innerHTML;
                    i18n.updateUI();
                    this.initViewLogic();
                }
            },
            initViewLogic() {
                switch(this.currentView) {
                    case 'library': this.renderLibrary(); break;
                    case 'detail': this.renderDetail(); break;
                    case 'gameplay': this.startGameLogic(); break;
                    case 'result': this.renderResult(); break;
                    case 'history': this.renderHistory(); break;
                }
            },
            renderLibrary() {
                const grid = document.getElementById('library-grid');
                grid.innerHTML = games.map(game => `
                    <div onclick="router.navigate('detail', { id: '${game.id}' })" 
                         class="game-card glass-card p-8 cursor-pointer transition-all duration-300 flex flex-col h-full border border-slate-800">
                        <div class="w-14 h-14 ${game.color} rounded-2xl flex items-center justify-center text-2xl mb-6">
                            ${game.icon}
                        </div>
                        <h3 class="text-2xl font-bold mb-2 font-kanit">${game.title[i18n.lang]}</h3>
                        <p class="text-slate-400 flex-grow">${game.desc[i18n.lang]}</p>
                        <div class="mt-8 flex items-center gap-2 text-indigo-400 font-bold group">
                            ${i18n.lang === 'th' ? 'เริ่มทดสอบ' : 'Play Now'} 
                            <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                        </div>
                    </div>
                `).join('');
            },
            renderDetail() {
                const game = games.find(g => g.id === this.params.id);
                if (!game) return this.navigate('library');
                document.getElementById('detail-title').innerText = game.title[i18n.lang];
                document.getElementById('detail-desc').innerText = game.desc[i18n.lang];
                const iconDiv = document.getElementById('detail-icon');
                iconDiv.innerText = game.icon;
                iconDiv.className = `w-32 h-32 md:w-48 md:h-48 rounded-3xl flex items-center justify-center text-6xl shadow-2xl ${game.color}`;
                const list = document.getElementById('instructions-list');
                list.innerHTML = [1,2,3].map(i => `
                    <li class="flex gap-3">
                        <span class="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-white text-xs font-bold">${i}</span>
                        ${i18n.t('instruction_' + i)}
                    </li>
                `).join('');
                document.getElementById('start-btn').onclick = () => this.navigate('gameplay', { id: game.id });
            },
            renderResult() {
                const game = games.find(g => g.id === this.params.id);
                const score = this.params.score;
                document.getElementById('result-label').innerText = game.title[i18n.lang];
                document.getElementById('result-value').innerText = `${score}${game.unit}`;
                document.getElementById('retry-btn').onclick = () => this.navigate('gameplay', { id: game.id });
                const pct = Math.floor(Math.random() * 40) + 50; 
                document.getElementById('result-percentile').innerText = `${pct}%`;
                document.getElementById('result-bar').style.width = `${pct}%`;
                const entry = {
                    gameId: game.id,
                    title: game.title,
                    score: score,
                    unit: game.unit,
                    date: new Date().toLocaleDateString(i18n.lang === 'th' ? 'th-TH' : 'en-US'),
                    timestamp: Date.now()
                };
                playHistory.unshift(entry);
                localStorage.setItem('skillpulse_history', JSON.stringify(playHistory.slice(0, 50)));
            },
            renderHistory() {
                const rows = document.getElementById('history-rows');
                const empty = document.getElementById('history-empty');
                const clearBtn = document.getElementById('clear-history');
                clearBtn.onclick = () => {
                    playHistory = [];
                    localStorage.removeItem('skillpulse_history');
                    this.renderHistory();
                };
                if (playHistory.length === 0) {
                    empty.classList.remove('hidden');
                    rows.innerHTML = '';
                    return;
                }
                empty.classList.add('hidden');
                rows.innerHTML = playHistory.map(item => `
                    <tr class="hover:bg-slate-800/30 transition-colors">
                        <td class="px-8 py-6 font-bold font-kanit">${item.title[i18n.lang]}</td>
                        <td class="px-8 py-6 text-indigo-400 font-mono font-bold">${item.score}${item.unit}</td>
                        <td class="px-8 py-6 text-slate-500">${item.date}</td>
                        <td class="px-8 py-6">
                            <span class="px-2 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-bold rounded uppercase">${i18n.t('status_success')}</span>
                        </td>
                    </tr>
                `).join('');
            },
            startGameLogic() {
                const game = games.find(g => g.id === this.params.id);
                const canvas = document.getElementById('game-canvas');
                const content = document.getElementById('game-state-content');
                document.getElementById('game-title-display').innerText = game.title[i18n.lang];
                let state = 'idle'; 
                let startTime = 0;
                let timeoutId = null;
                const updateUI = () => {
                    canvas.classList.remove('state-idle', 'state-waiting', 'state-ready');
                    if (state === 'idle') {
                        canvas.classList.add('state-idle');
                        content.innerHTML = `<h2 class="text-4xl font-black mb-4 font-kanit">${i18n.t('game_ready')}</h2><p class="text-slate-300">${i18n.t('game_ready_sub')}</p>`;
                    } else if (state === 'waiting') {
                        canvas.classList.add('state-waiting');
                        content.innerHTML = `<h2 class="text-4xl font-black mb-4 font-kanit">${i18n.t('game_wait')}</h2>`;
                    } else if (state === 'ready') {
                        canvas.classList.add('state-ready');
                        content.innerHTML = `<h2 class="text-4xl font-black mb-4 font-kanit">${i18n.t('game_click')}</h2>`;
                    } else if (state === 'too-soon') {
                        canvas.classList.add('state-idle');
                        content.innerHTML = `<h2 class="text-4xl font-black mb-4 text-rose-400 font-kanit">${i18n.t('game_too_soon')}</h2><p class="text-slate-300">${i18n.t('game_too_soon_sub')}</p>`;
                    }
                };
                canvas.onclick = () => {
                    if (state === 'idle' || state === 'too-soon') {
                        state = 'waiting';
                        updateUI();
                        const delay = Math.random() * 3000 + 2000; 
                        timeoutId = setTimeout(() => {
                            state = 'ready';
                            startTime = performance.now();
                            updateUI();
                        }, delay);
                    } else if (state === 'waiting') {
                        clearTimeout(timeoutId);
                        state = 'too-soon';
                        updateUI();
                    } else if (state === 'ready') {
                        const endTime = performance.now();
                        const reactionTime = Math.round(endTime - startTime);
                        this.navigate('result', { id: game.id, score: reactionTime });
                    }
                };
                updateUI();
            }
        };

        window.onload = () => {
            i18n.updateUI();
            router.navigate('landing');
        };
    </script>
</body>
</html>
